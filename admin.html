<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Tech Town</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #f8fafc; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn-submit { background: #ef4444; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background: #dc2626; }
        .admin-products-list { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
            <div class="brand" style="display: flex; align-items: center; gap: 12px;">
                <div class="brand-logo-container" style="width: 48px; height: 48px; border-radius: 10px; overflow: hidden; background: #000;">
                    <img src="logo.jpg" alt="Tech Town Logo" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="brand-name" style="display: flex; flex-direction: column;">
                    <span style="font-weight: bold; color: #fff; font-size: 18px;">TECH TOWN</span>
                    <small style="color: #ef4444; font-size: 12px;">لوحة التحكم الإدارية</small>
                </div>
            </div>
            <div>
                <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 14px; font-weight: bold;">← عرض المتجر الرئيسي</a>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <h2 style="text-align: center; color: #ef4444; margin-bottom: 10px;">إضافة منتج جديد</h2>
        <p style="text-align: center; color: #cbd5e1; font-size: 13px; margin-bottom: 20px;">إضافة منتج وتحديد القسم والمخزون</p>
        
        <form id="add-product-form">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="p-title" required placeholder="مثال: لابتوب MSI Cyborg 15 أو جوستك PS5">
            </div>

            <div class="form-group">
                <label>قسم المنتج (التصنيف):</label>
                <select id="p-category" required>
                    <option value="laptops">💻 حواسب وملحقاتها (لابتوبات، حقائب، شواحن)</option>
                    <option value="gaming">🎮 عالم الكيمنج (جوستكات، بليات، ستاندات، شواحن)</option>
                    <option value="mobile-acc">📱 اكسسوارات الهاتف (كيبلات، شواحن، OTG، سماعات)</option>

                    <option value="mouses-keyboards">🖱️ ماوسات وكيبوردات</option>
                    <option value="printers">🖨️ طابعات ومستلزماتها (طابعات، أحبار، كيبلات)</option>
                    <option value="networks">🌐 شبكات وتوصيلات (LAN، محولات)</option>
                    <option value="disks">💿 أقراص ووسائط تخزين</option>
                    <option value="general">📦 عام / أخرى</option>
                </select>
            </div>
            
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>السعر (د.ع):</label>
                    <input type="number" id="p-price" required placeholder="25000">
                </div>
                <div style="flex: 1;">
                    <label>الكمية المتوفرة (المخزون):</label>
                    <input type="number" id="p-stock" min="1" value="10" required placeholder="10">
                </div>
            </div>

            <div class="form-group">
                <label>وصف المنتج / المواصفات:</label>
                <textarea id="p-specs" rows="4" placeholder="اكتب مواصفات المنتج هنا..."></textarea>
            </div>

            <div class="form-group">
                <label>الصور (اختر صورة رئيسية وأخرى فرعية معاً):</label>
                <input type="file" id="p-images" accept="image/*" multiple required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">حفظ ونشر المنتج</button>
        </form>
    </div>

    <div class="admin-products-list">
        <h3 style="color: #fff; margin-bottom: 15px;">إدارة المنتجات الحالية</h3>
        <div id="products-list-container">
            <p style="color: #aaa;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNMXzRCNyXTfr4suYWx6e6Ds2nS_SX408",
            authDomain: "tech-town-7e489.firebaseapp.com",
            projectId: "tech-town-7e489",
            storageBucket: "tech-town-7e489.appspot.com",
            messagingSenderId: "1888450260",
            appId: "1:1888450260:web:6555291b5bb9cd9f92d41",
            measurementId: "G-VMKX1CQXW9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const form = document.getElementById('add-product-form');
        const submitBtn = document.getElementById('submit-btn');
        const listContainer = document.getElementById('products-list-container');

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري رفع المنتجات وصورها...';

            try {
                const title = document.getElementById('p-title').value;
                const category = document.getElementById('p-category').value;
                const price = Number(document.getElementById('p-price').value);
                const stock = Number(document.getElementById('p-stock').value) || 1;
                const specs = document.getElementById('p-specs').value;
                const files = document.getElementById('p-images').files;

                const base64Images = [];
                for (let i = 0; i < files.length; i++) {
                    const b64 = await fileToBase64(files[i]);
                    base64Images.push(b64);
                }

                await db.collection('products').add({
                    title: title,
                    category: category,
                    price: price,
                    stock: stock,
                    specs: specs,
                    images: base64Images,
                    imageUrl: base64Images[0] || '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('تم إضافة المنتج في القسم المختار بنجاح!');
                form.reset();
            } catch (err) {
                alert('حدث خطأ: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'حفظ ونشر المنتج';
            }
        });

        db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            listContainer.innerHTML = '';
            if (snapshot.empty) {
                listContainer.innerHTML = '<p style="color: #aaa;">لا توجد منتجات مضافة.</p>';
                return;
            }

            snapshot.forEach(doc => {
                const p = doc.data();
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div>
                        <strong style="color: #fff;">${p.title || p.name}</strong>
                        <div style="font-size: 13px; color: #aaa;">السعر: ${p.price?.toLocaleString()} د.ع | القسم: <span style="color: #38bdf8;">${getCategoryName(p.category)}</span> | المخزون: <span style="color: #ef4444;">${p.stock ?? 10}</span></div>
                    </div>
                    <button class="btn-delete" onclick="deleteProduct('${doc.id}')">حذف</button>
                `;
                listContainer.appendChild(div);
            });
        });

        function getCategoryName(catKey) {
            const map = {
                'laptops': '💻 حواسب وملحقاتها',
                'gaming': '🎮 عالم الكيمنج',
                'mobile-acc': '📱 اكسسوارات الهاتف',
                'mouses-keyboards': '🖱️ ماوسات وكيبوردات',
                'printers': '🖨️ طابعات ومستلزماتها',
                'networks': '🌐 شبكات وتوصيلات',
                'disks': '💿 أقراص وتخزين',
                'general': '📦 عام / أخرى'
            };
            return map[catKey] || 'عام';
        }

        async function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                await db.collection('products').doc(id).delete();
            }
        }
    </script>
</body>
</html>
