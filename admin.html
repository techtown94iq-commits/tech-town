<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Tech Town - إدارة المنتجات</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        input[type="file"] { margin-top: 5px; color: #cbd5e1; }
        .btn-submit { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background: #0369a1; }
        .btn-submit:disabled { background: #64748b; cursor: not-allowed; }
        .products-list { margin-top: 40px; }
        .admin-card { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .admin-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .admin-card-info { flex-grow: 1; margin-right: 15px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .btn-delete:hover { background: #dc2626; }
        .status-msg { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>🛠️ لوحة تحكم مركز Tech Town</h1>
        <p style="text-align: center; color: #94a3b8;">إضافة وتعديل المنتجات مباشرة في المتجر</p>
        
        <form id="add-product-form">
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="p-title" placeholder="مثال: سماعة ألعاب Cat Ear RGB" required>
            </div>
            <div class="form-group">
                <label>السعر (بالدينار العراقي):</label>
                <input type="number" id="p-price" placeholder="مثال: 15000" required>
            </div>
            <div class="form-group">
                <label>المواصفات / الوصف القصير:</label>
                <input type="text" id="p-specs" placeholder="مثال: صوت ستيريو، إضاءة RGB، ميكروفون مدمج" required>
            </div>
            <div class="form-group">
                <label>شارة المنتج (اختياري):</label>
                <select id="p-badge">
                    <option value="">بدون شارة</option>
                    <option value="جديد">جديد</option>
                    <option value="عرض خاص">عرض خاص</option>
                    <option value="الأكثر مبيعاً">الأكثر مبيعاً</option>
                </select>
            </div>
            <div class="form-group">
                <label>صورة المنتج:</label>
                <input type="file" id="p-image" accept="image/*" required>
            </div>
            <button type="submit" id="submit-btn" class="btn-submit">🚀 إضافة المنتج للمتجر</button>
            <div id="status" class="status-msg"></div>
        </form>

        <div class="products-list">
            <h2>📦 المنتجات الحالية في المتجر</h2>
            <div id="admin-products-grid">جاري تحميل المنتجات...</div>
        </div>
    </div>

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMNXzRCNyXTfr4suYWx6e6Ds2nS_SX408",
            authDomain: "tech-town-7e489.firebaseapp.com",
            projectId: "tech-town-7e489",
            storageBucket: "tech-town-7e489.firebasestorage.app",
            messagingSenderId: "1888450260",
            appId: "1:1888450260:web:65555291b5bb9cd9f92d41",
            measurementId: "G-VMKX1CQXW9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const form = document.getElementById('add-product-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusDiv = document.getElementById('status');
        const productsGrid = document.getElementById('admin-products-grid');

        // رفع وإضافة منتج
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('p-title').value;
            const price = Number(document.getElementById('p-price').value);
            const specs = document.getElementById('p-specs').value;
            const badge = document.getElementById('p-badge').value;
            const imageFile = document.getElementById('p-image').files[0];

            if (!imageFile) return alert('يرجى اختيار صورة للمنتج');

            submitBtn.disabled = true;
            statusDiv.style.color = '#38bdf8';
            statusDiv.innerText = 'جاري رفع الصورة وإضافة المنتج...';

            try {
                // 1. رفع الصورة إلى Storage
                const storageRef = storage.ref(`products/${Date.now()}_${imageFile.name}`);
                const snapshot = await storageRef.put(imageFile);
                const imageUrl = await snapshot.ref.getDownloadURL();

                // 2. حفظ البيانات في Firestore
                await db.collection('products').add({
                    title,
                    price,
                    specs,
                    badge,
                    imageUrl,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                statusDiv.style.color = '#4ade80';
                statusDiv.innerText = '✅ تم إضافة المنتج بنجاح!';
                form.reset();
                loadAdminProducts();
            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = '❌ حدث خطأ: ' + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });

        // جلب المنتجات للوحة التحكم مع إمكانية الحذف
        function loadAdminProducts() {
            db.collection('products').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
                productsGrid.innerHTML = '';
                if (snapshot.empty) {
                    productsGrid.innerHTML = '<p style="text-align:center;">لا توجد منتجات مضافة بعد.</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const item = doc.data();
                    const card = document.createElement('div');
                    card.className = 'admin-card';
                    card.innerHTML = `
                        <img src="${item.imageUrl}" alt="${item.title}">
                        <div class="admin-card-info">
                            <strong>${item.title}</strong>
                            <div style="font-size:12px; color:#cbd5e1;">${item.price.toLocaleString()} د.ع | ${item.specs}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct('${doc.id}')">حذف</button>
                    `;
                    productsGrid.appendChild(card);
                });
            });
        }

        async function deleteProduct(id) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا المنتج؟')) {
                await db.collection('products').doc(id).delete();
            }
        }

        loadAdminProducts();
    </script>
</body>
</html>
