<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Tech Town</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; direction: rtl; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        input[type="file"] { width: 100%; padding: 5px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
        .btn-submit { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background: #0369a1; }
        #loading { display: none; text-align: center; color: #38bdf8; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>لوحة تحكم Tech Town</h1>
    <p style="text-align: center; color: #94a3b8;">إضافة وتعديل المنتجات مباشرة في المتجر بدون تعقيد</p>

    <form id="productForm">
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>السعر ($):</label>
            <input type="number" id="price" step="0.01" required>
        </div>
        <div class="form-group">
            <label>وصف المنتج:</label>
            <textarea id="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>صورة المنتج:</label>
            <input type="file" id="imageFile" accept="image/*" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">حفظ ونشر المنتج</button>
        <div id="loading">جاري معالجة الصورة وحفظ المنتج في قاعدة البيانات... يرجى الانتظار</div>
    </form>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // إعدادات مشروعك المربوط مسبقاً
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "tech-town-7e489.firebaseapp.com",
        projectId: "tech-town-7e489",
        storageBucket: "tech-town-7e489.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('productForm');
    const loadingDiv = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.style.display = 'none';
        loadingDiv.style.display = 'block';

        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const description = document.getElementById('description').value;
        const fileInput = document.getElementById('imageFile');
        const file = fileInput.files[0];

        try {
            // تحويل الصورة مباشرة إلى Base64 لتخزينها داخل Firestore بدون الحاجة لخدمة Storage المدفوعة
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Image = reader.result;

                const productRef = doc(collection(db, "products"));
                await setDoc(productRef, {
                    name: name,
                    price: parseFloat(price),
                    description: description,
                    imageUrl: base64Image,
                    createdAt: new Date()
                });

                alert('تم إضافة ونشر المنتج بنجاح إلى متجر Tech Town!');
                form.reset();
                submitBtn.style.display = 'block';
                loadingDiv.style.display = 'none';
            };
        } catch (error) {
            console.error("خطأ أثناء الحفظ: ", error);
            alert('حدث خطأ أثناء رفع المنتج: ' + error.message);
            submitBtn.style.display = 'block';
            loadingDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
