<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Tech Town</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; direction: rtl; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #fff; box-sizing: border-box; }
        input[type="file"] { width: 100%; padding: 5px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
        .btn-submit { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background: #0369a1; }
        #loading { display: none; text-align: center; color: #38bdf8; margin-top: 10px; font-weight: bold; }
        
        .products-list { margin-top: 40px; border-top: 1px solid #334155; padding-top: 20px; }
        .admin-card { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .admin-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; margin-left: 15px; }
        .admin-card-info { flex-grow: 1; display: flex; align-items: center; gap: 15px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>لوحة تحكم Tech Town</h1>
    <p style="text-align: center; color: #94a3b8;">إضافة منتج مع صور متعددة وحذفه</p>

    <form id="productForm">
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>السعر (د.ع):</label>
            <input type="number" id="price" required>
        </div>
        <div class="form-group">
            <label>وصف المنتج / المواصفات:</label>
            <textarea id="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>الصور (اختر صورة رئيسية أو عدة صور معاً):</label>
            <input type="file" id="imageFiles" accept="image/*" multiple required>
            <small style="color: #94a3b8; display: block; margin-top: 5px;">يمكنك اختيار أكثر من صورة بضغطة زر (أول صورة ستكون الرئيسية)</small>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">حفظ ونشر المنتج</button>
        <div id="loading">جاري معالجة الصور ورفع المنتج... يرجى الانتظار</div>
    </form>

    <div class="products-list">
        <h2>إدارة المنتجات الحالية</h2>
        <div id="admin-products-container">
            <p style="text-align: center; color: #94a3b8;">جاري تحميل المنتجات...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCNMXzRCNyXTfr4suYWx6e6Ds2nS_SX408",
        authDomain: "tech-town-7e489.firebaseapp.com",
        projectId: "tech-town-7e489",
        storageBucket: "tech-town-7e489.appspot.com",
        messagingSenderId: "1888450260",
        appId: "1:1888450260:web:6555291b5bb9cd9f92d41",
        measurementId: "G-VMKX1CQXW9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById('productForm');
    const loadingDiv = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');
    const adminContainer = document.getElementById('admin-products-container');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.style.display = 'none';
        loadingDiv.style.display = 'block';

        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const description = document.getElementById('description').value;
        const fileInput = document.getElementById('imageFiles');
        const files = fileInput.files;

        try {
            const imagePromises = Array.from(files).fileConvert = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                });
            };

            // تحويل كل الصور المحددة إلى Base64
            const base64Images = [];
            for (let i = 0; i < files.length; i++) {
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(files[i]);
                    reader.onload = () => resolve(reader.result);
                });
                base64Images.push(base64);
            }

            const productRef = doc(collection(db, "products"));
            await setDoc(productRef, {
                title: name,
                name: name,
                price: parseFloat(price),
                specs: description,
                description: description,
                imageUrl: base64Images[0], // الصورة الرئيسية للبطاقة
                images: base64Images,      // مصفوفة تحتوي على كل الصور لعرضها بالمعرض
                createdAt: new Date()
            });

            alert('تم إضافة المنتج مع صوره المتعددة بنجاح!');
            form.reset();
            submitBtn.style.display = 'block';
            loadingDiv.style.display = 'none';
        } catch (error) {
            console.error("خطأ: ", error);
            alert('حدث خطأ: ' + error.message);
            submitBtn.style.display = 'block';
            loadingDiv.style.display = 'none';
        }
    });

    const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        adminContainer.innerHTML = '';
        if (snapshot.empty) {
            adminContainer.innerHTML = '<p style="text-align: center; color: #94a3b8;">لا توجد منتجات مضافة حالياً.</p>';
            return;
        }

        snapshot.forEach((docSnap) => {
            const p = docSnap.data();
            const productId = docSnap.id;
            const title = p.title || p.name || "بدون اسم";
            const price = p.price || 0;
            const image = p.imageUrl || (p.images && p.images[0]) || "";

            const card = document.createElement('div');
            card.className = 'admin-card';
            card.innerHTML = `
                <div class="admin-card-info">
                    <img src="${image}" alt="${title}">
                    <div>
                        <strong>${title}</strong>
                        <div style="font-size: 13px; color: #38bdf8;">د.ع ${price.toLocaleString()} (${p.images ? p.images.length : 1} صور)</div>
                    </div>
                </div>
                <button class="btn-delete" onclick="deleteProduct('${productId}')">حذف</button>
            `;
            adminContainer.appendChild(card);
        });
    });

    window.deleteProduct = async function(id) {
        if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
            try {
                await deleteDoc(doc(db, "products", id));
                alert('تم الحذف بنجاح!');
            } catch (error) {
                alert('خطأ أثناء الحذف: ' + error.message);
            }
        }
    };
</script>

</body>
</html>
